name: Share a routine
description: A sequence you teach or practise, for anyone to use.
title: "Routine: "
labels: ["routine"]
body:
  - type: markdown
    attributes:
      value: |
        Prefer the [Routines editor](https://syntithenai.github.io/open-yoga-poses/routines.html): it fills this form for you. A maintainer can apply a machine-readable submission with the `apply-edit` label.
  - type: input
    id: routine-title
    attributes:
      label: Title
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: Credit as
      description: Your name. Include your email in angle brackets (Name &lt;you@example.com&gt;) so you can claim the routine in SynthYoga with the same signed-in account.
    validations:
      required: true
  - type: dropdown
    id: level
    attributes:
      label: Level
      options:
        - "1"
        - "2"
        - "3"
        - "4"
        - "5"
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: One pose per line with how long to hold it, and right or left for one-sided poses. Pose ids from the viewer help, but names are fine.
      placeholder: |
        easy, 60s
        low-lunge, 30s, right
        low-lunge, 30s, left
    validations:
      required: true
  - type: textarea
    id: edit-data
    attributes:
      label: Routine data (from the editor)
      description: Machine-readable open-yoga-edit/1 envelope. Leave blank if you only filled the steps above by hand.
      render: json
  - type: textarea
    id: notes
    attributes:
      label: Notes (optional)
      description: Who it's for, cues you like to give, anything else.
  - type: checkboxes
    id: licence
    attributes:
      label: Licence
      options:
        - label: This is my own sequence and I agree to share it under CC BY-SA 4.0.
          required: true
